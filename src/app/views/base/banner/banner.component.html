<div class="my-2">
  <div class="slide-container">
    <p-carousel [value]="bannerImages" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000"
      [showNavigators]="false"  >
      <ng-template let-image let-i="index" pTemplate="item">
        <div class="relative">
          <img [src]="image.imageUrl" alt="Slide Image" class="format-img">
        </div>
      </ng-template>
    </p-carousel>
  </div>
</div>

<!-- Thêm mới nút -->
<div class="mt-3 d-flex">
  <button pButton type="button" label="Thêm mới" icon="pi pi-plus" (click)="openDialog()"></button>
</div>

<div class="mt-3">
  <p-table [value]="bannerImages" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>STT</th>
        <th>Ảnh</th>
        <th>Đường dẫn</th>
        <th>Thứ tự</th>
        <th>Hiển thị</th>
        <th>Hành động</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-banner let-i="rowIndex">
      <tr>
        <td>{{ i + 1 }}</td>
        <td>
          <!-- <img [src]="banner.imageUrl" alt="banner" width="100" height="50"> -->
        </td>
        <td>{{ banner.link || '-' }}</td>
        <td>{{ banner.orderIndex }}</td>
        <td>
          <p-toggleswitch [ngModel]="banner.isActive" (onChange)="onToggleActive(banner.bannerID)" />
        </td>
        <td>
          <p-speeddial [model]="actions" direction="right" (click)="setCurrentBanner(banner)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
