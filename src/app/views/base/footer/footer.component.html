<p-toast />
<p-confirmdialog />
<footer class="container-footer">
  <div class="footer-content d-flex aligh-items-center justify-content-center">

    <div class="footer-logo">
      <img src="../../../assets/images/logo.png" alt="Logo">
    </div>

    <!-- Footer Links -->
    <div class="footer-links">
      <a *ngFor="let link of footerLinks" [href]="link.link">{{ link.title }}</a>
    </div>

    <!-- Footer Icons -->
    <div class="footer-social">
      <a *ngFor="let icon of footerIcons" [href]="icon.link" target="_blank" rel="noopener noreferrer">
        <i [class]="icon.iconName || 'pi pi-question'"></i>
      </a>
    </div>


  </div>
  <div class="footer-bottom">
    © 2025 Comic Paradise was code by MinhLee ^^. All Rights Reserved.
  </div>
</footer>

<!-- Thêm mới nút -->
<div class="mt-3 d-flex">
  <button pButton type="button" label="Thêm mới" icon="pi pi-plus" (click)="openDialog()"></button>
</div>

<div class="mt-3">
  <p-table [value]="footerContents" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Tiêu đề</th>
        <th>Biểu tượng</th>
        <th>Đường dẫn</th>
        <th>Hiển thị</th>
        <th>Hành động</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-footer>
      <tr>
        <td>{{ footer.title || '-' }}</td>
        <td>{{ footer.iconName || '-' }}</td>
        <td>{{ footer.link || '-' }}</td>
        <td>
          <p-toggleswitch [ngModel]="footer.isActive" (onChange)="onToggleActive(footer.footerContentID)" />
        </td>
        <td>
          <p-speeddial [model]="actions" direction="right" (click)="setCurrentFooter(footer)"/>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- Dialog Thêm mới -->
<p-dialog header="Thêm mới footer" [(visible)]="displayAddFooterDialog" [modal]="true" [style]="{ width: '400px' }"
  [draggable]="false" [resizable]="false">

  <div class="d-flex flex-column mb-2 footer-title">
    <label for="title">Tiêu đề</label>
    <input id="title" type="text" pInputText [(ngModel)]="newFooter.title" placeholder="vd: Chính sách bảo mật" />
  </div>

  <div class="d-flex flex-column mb-2 footer-icon">
    <label for="icon">Biểu tượng (PrimeIcons)</label>
    <input id="icon" type="text" pInputText [(ngModel)]="newFooter.iconName" placeholder="vd: pi pi-facebook" />
  </div>

  <div class="d-flex flex-column mb-2 footer-path">
    <label for="link">Đường dẫn</label>
    <input id="link" type="text" pInputText [(ngModel)]="newFooter.link" placeholder="vd: https://facebook.com" />
  </div>


  <div class="d-flex justify-content-between  mb-2 footer-active">
    <label for="isActive">Hiển thị</label>
    <p-inputSwitch [(ngModel)]="newFooter.isActive"></p-inputSwitch>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <p-button label="Hủy" severity="secondary" (click)="closeDialog()"/>
    <p-button label="Xác nhận" severity="success" (click)="addFooterContent()" />
  </div>
</p-dialog>

<!-- Dialog cập nhật -->
<p-dialog header="Thêm mới footer" [(visible)]="displayUpdateFooterDialog" [modal]="true" [style]="{ width: '400px' }"
  [draggable]="false" [resizable]="false">

  <div class="d-flex flex-column mb-2 footer-title">
    <label for="title">Tiêu đề</label>
    <input id="title" type="text" pInputText [(ngModel)]="selectedFooter.title" placeholder="vd: Chính sách bảo mật" />
  </div>

  <div class="d-flex flex-column mb-2 footer-icon">
    <label for="icon">Biểu tượng (PrimeIcons)</label>
    <input id="icon" type="text" pInputText [(ngModel)]="selectedFooter.iconName" placeholder="vd: pi pi-facebook" />
  </div>

  <div class="d-flex flex-column mb-2 footer-path">
    <label for="link">Đường dẫn</label>
    <input id="link" type="text" pInputText [(ngModel)]="selectedFooter.link" placeholder="vd: https://facebook.com" />
  </div>


  <div class="d-flex justify-content-between  mb-2 footer-active">
    <label for="isActive">Hiển thị</label>
    <p-inputSwitch [(ngModel)]="selectedFooter.isActive"></p-inputSwitch>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <p-button label="Hủy" severity="secondary" (click)="closeDialog()"/>
    <p-button label="Xác nhận" severity="success" (click)="updateFooterContent()" />
  </div>
</p-dialog>
