<p-toast/>
<c-card>
  <c-card-header>
    <h5>Thêm thành viên</h5>
  </c-card-header>
  <c-card-body class="p-4">
    <div class="row">
      <div class="col-12 col-sm-12 col-md-5 col-lg-5 col-xl-5 ">
        <div class="button-back d-flex align-items-center" (click)="navigateToMemberManagement()"
          style="cursor: pointer;">
          <i class="pi pi-arrow-circle-left" style="font-size: 30px;"></i>
        </div>
      </div>
    </div>
    <hr>

    <div class="member-infor">
      <div class="row">
        <div class="col-12 col-sm-12 col-md-5 col-lg-5 col-xl-5 ">
          <h6 class="mt-5"><b>1. Ảnh đại diện</b></h6>
          <div class="d-flex justify-content-start">
            <p-fileupload mode="basic" name="demo[]" chooseIcon="pi pi-image" accept="image/*" maxFileSize="1000000"
              (onSelect)="onUpload($event)" [auto]="true" chooseLabel="Chọn ảnh chính" />
          </div>
          <div class="mt-3 border">
            <p-image *ngIf="primaryImgDisplay" [src]="primaryImgDisplay" alt="Image" width="100%" [preview]="true" />
          </div>
        </div>

        <div class="col-12 col-sm-12 col-md-7 col-lg-7 col-xl-7 ">
          <h6 class="mt-5"><b>2. Thông tin cá nhân</b></h6>
          <div class="row">
            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
              <div class="d-flex flex-column">
                <label for="username" class="block mt-3">Họ và tên</label>
                <input pInputText id="username" aria-describedby="username-help" [(ngModel)]="username" />
              </div>
            </div>

            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 ">
              <div class="d-flex flex-column">
                <label for="gender" class="block mt-3">Email</label>
                <input pInputText id="email" aria-describedby="email-help" [(ngModel)]="email" />
              </div>
            </div>


            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-6 ">
              <div class="d-flex flex-column">
                <label for="phone" class="block mt-3">Số điện thoại</label>
                <input pInputText id="phone" aria-describedby="username-help" [(ngModel)]="phone" />
              </div>
            </div>


            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
              <div class="d-flex flex-column">
                <label for="dob" class="block mt-3 ">Loại tài khoản</label>
                <div class="d-flex my-2">
                  <div class="flex items-center">
                    <p-radiobutton value="Reader" [(ngModel)]="typeAccount" inputId="ingredient1" />
                    <label for="ingredient1" class="mx-2">Độc giả</label>
                  </div>

                  <div class="flex items-center ms-5">
                    <p-radiobutton value="Publisher" [(ngModel)]="typeAccount" inputId="ingredient2" />
                    <label for="ingredient2" class="mx-2">Tác giả</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
              <div class="d-flex flex-column">
                <label for="address" class="block mt-3">Mật khẩu</label>
                <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true" styleClass="w-100 format-input" class=" format-input w-100"  />

                <label for="address" class="block mt-3">Xác nhận mật khẩu</label>
                <p-password [(ngModel)]="comfirmPassword" [feedback]="false" [toggleMask]="true" styleClass="w-100 format-input" class=" format-input w-100"  />

              </div>
            </div>

            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 ">
              <div class="d-flex flex-column">
                <div class="d-flex justify-content-end mt-5">
                  <p-button label="Xác nhận" (click)="addMember()"/>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </c-card-body>
</c-card>
