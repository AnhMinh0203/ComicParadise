<p-toast />
<div class="container my-5">
  <div class="d-flex justify-content-center ">
    <!-- Chapter action -->
    <p-speeddial [model]="chapterActions" direction="up"
      [style]="{ position: 'fixed', bottom: '4.2rem', right: '1.3rem', zIndex: 1000 }">
    </p-speeddial>

    <div class="col-12 col-sm-12 col-md-8 col-lg-6 col-xl-6 mt-1">
      <!-- Fixed Top Navigator -->
      <div id="topNavigator" class="chapter-navigator fixed-top d-flex justify-content-center align-items-center gap-3"
        [class.hidden]="!showTopNavigator">

        <div class="nav-icon d-flex justify-content-center align-items-center" [class.disabled]="!hasPreviousChapter"
          (click)="hasPreviousChapter && goToPreviousChapter()" pTooltip="Chương trước">
          <i class="pi pi-chevron-left"></i>
        </div>

        <p-dropdown [options]="chapterList" [(ngModel)]="selectedChapter" optionLabel="title" placeholder="Chọn chương"
          (onChange)="onChapterSelect($event.value)">
        </p-dropdown>

        <div class="nav-icon d-flex justify-content-center align-items-center" [class.disabled]="!hasNextChapter"
          (click)="hasNextChapter && goToNextChapter()" pTooltip="Chương tiếp theo">
          <i class="pi pi-chevron-right"></i>
        </div>
      </div>

      <!-- Nội dung truyện dạng ảnh -->
      <div *ngIf="chapterContent && chapterContent.storyType === 'Manga'" class="mt-3">
        <div *ngFor="let imageUrl of chapterContent.imageUrls">
          <img #pageImage [src]="imageUrl" alt="Chapter Image" style="width:100%;" loading="lazy">
        </div>
      </div>

      <!-- Hiển thị chương dạng văn bản -->
      <div class="story-novel" *ngIf="chapterContent && chapterContent.storyType === 'Novel'">
        <button (click)="readAloud()" class="btn btn-primary mb-2">
          <div class="d-flex justify-center align-items-center">
            <i class="pi pi-volume-up"></i>
            <span class="ms-2">Đọc chương</span>
          </div>
        </button>

        <!-- Nút dừng -->
        <button (click)="stopReading()" class="btn btn-danger mb-2 ms-2">
          <div class="d-flex justify-center align-items-center">
            <i class="pi pi-pause "></i>
            <div class="ms-2">Dừng</div>
          </div>
        </button>
        <div  class="mt-3">
          <div class="chapter-text-content" [innerHTML]="chapterContent.content"></div>
        </div>
      </div>

      <!-- Điều hướng chương -->
      <div class="d-flex justify-content-center align-items-center mt-4 gap-3">
        <div class="nav-icon d-flex justify-content-center align-items-center" [class.disabled]="!hasPreviousChapter"
          (click)="hasPreviousChapter && goToPreviousChapter()" pTooltip="Chương trước">
          <i class="pi pi-chevron-left"></i>
        </div>

        <p-dropdown [options]="chapterList" [(ngModel)]="selectedChapter" optionLabel="title" placeholder="Chọn chương"
          [filter]="true" class="chapter-dropdown" (onChange)="onChapterSelect($event.value)">
        </p-dropdown>

        <div class="nav-icon d-flex justify-content-center align-items-center" [class.disabled]="!hasNextChapter"
          (click)="hasNextChapter && goToNextChapter()" pTooltip="Chương tiếp theo">
          <i class="pi pi-chevron-right"></i>
        </div>
      </div>
    </div>
  </div>
</div>
<p-scrolltop />
