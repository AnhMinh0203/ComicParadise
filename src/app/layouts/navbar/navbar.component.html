<nav class="navbar d-flex justify-content-between aligh-items-center">

  <!-- Logo -->
  <div class="d-flex">
    <div class="header-logo ">
      <a href="#">
        <img src="../../../assets/images/logo.png" href="#" alt="Logo">
      </a>
    </div>
    <!-- Right Side -->
    <div class="navbar-left">
      <a href="#">Trang chủ</a>
      <!-- <a href="">Thể loại</a> -->
      <p-megamenu [model]="items" />
      <a (click)="navigateToContact()">Giới thiệu</a>

      <!-- Search Input -->
      <div class="search-box">
        <input type="text" placeholder="Tìm kiếm...">
        <i class="pi pi-search"></i>
      </div>
    </div>
  </div>

  <div class="bar-mobile mx-3" (click)="toggleSidebar()">
    <i class="pi pi-bars"></i>
  </div>

  <div class="navbar-right">
    <!-- Notification Icon -->
    <div class="notification" (click)="showDialogNotify()">
      <i class="pi pi-bell"></i>
      <span class="badge">3</span>
    </div>

    <!-- Toggle Theme Icon -->
    <div class="toggle-theme " (click)="toggleTheme()">
      <i class="pi" [ngClass]="isDarkMode ? 'pi-moon' : 'pi-sun'"></i>
    </div>

    <!-- Avatar -->
    <div class="avatar">
      <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/asiyajavayant.png" class="mr-2"
        size="large" shape="circle" />
    </div>
  </div>
</nav>
